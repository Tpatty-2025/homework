<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼎金國小502班級電子聯絡簿</title>
    <style>
        :root {
            --primary-color: #4a86e8;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --border-radius: 12px;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        /* 卡片共用樣式 */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-left: 5px solid var(--primary-color);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--primary-color);
            border-bottom: 1px dashed #ccc;
            padding-bottom: 10px;
        }

        /* 每週一句特別樣式 */
        .quote-card {
            border-left-color: #ff9800;
        }
        .quote-card h2 { color: #ff9800; }
        .quote-text {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            color: #555;
        }

        /* 注意事項特別樣式 */
        .notice-card {
            border-left-color: #e53935;
        }
        .notice-card h2 { color: #e53935; }
        .notice-list {
            padding-left: 20px;
            color: #d32f2f;
            font-weight: bold;
        }

        /* 歷史紀錄選擇器 */
        .history-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .history-selector select {
            padding: 8px 12px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        /* 抄寫清單樣式 */
        .homework-list {
            list-style-type: decimal;
            padding-left: 25px;
            font-size: 1.1rem;
        }
        
        .homework-list li {
            margin-bottom: 10px;
        }

        @media (max-width: 500px) {
            .history-selector {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>502班級電子聯絡簿</h1>
        </div>

        <div class="history-selector">
            <label for="dateSelect"><strong>📅 選擇日期：</strong></label>
            <select id="dateSelect" onchange="renderContent()"></select>
        </div>

        <div class="card quote-card">
            <h2>💡 每週一句</h2>
            <div class="quote-text" id="quoteDisplay"></div>
        </div>

        <div class="card">
            <h2 id="currentDateTitle">📖 聯絡簿內容</h2>
            <ol class="homework-list" id="homeworkDisplay"></ol>
        </div>

        <div class="card notice-card">
            <h2>⚠️ 本週注意事項</h2>
            <ul class="notice-list" id="noticeDisplay"></ul>
        </div>
    </div>

    <script>
        // ==========================================
        // ✏️ 請在這裡修改你的資料內容
        // ==========================================

        // 1. 修改每週一句
        const weeklyQuote = "學習是為了遇見更好的自己。";
        //把挑戰當磨練，讓自己變堅強。
        //認真的做每件事，有趣的事就會發生。
        //用不同的角度看世界，會發現美好的事物。
        //培養自己成為一位充滿自信的人。
        //在人生的大海中，沒有不受傷的船。
        //知識是最安全的財富，沒有任何人能竊取。



        //看見自己的優點，精進自己的專長。

        // 2. 修改本週注意事項 (若有多點，請依照格式新增)
        const notices = [
            "",
           
        ];

        // 3. 修改聯絡簿歷史紀錄 
        // 最上方放最新日期，欄位包含 date(日期) 和 items(抄寫項目陣列)
        const contactBookRecords = [
            {
                date: "2026-08-28 (五)",
                items: [

                    "若有需要攜帶行動載具(手機、智慧手錶)，請告知導師並填寫申請書。",
                   
                ]
            },
            {

                items: [

                    "發下社團簡章",
                    "甲本L.1生字部分",
                    "數習p.4~5",
                   
                ]
            },
            {
                date: "2026-09-01 (二)",
                items: [
                    "甲本p.10~13",
                    "數習p.6~7",
                  
                ]
            },
            {
                date: "2026-09-02 (三)",
                items: [
                    "國L.1圈詞",

                ]
            },
            {

                    "國L.1成語造句",
                    "數習p.10~11",
                ]
            },
            {
                date: "2026-09-04 (五)",
                items: [
                    "國習L.1",
                    "數習p.12~13",
                    "做一件家事：___________",
                    
                ]
            },
            {
                date: "2026-09-07 (一)",
                items: [
                    "乙本L.2生字部分",

                ]
            },
            {
                date: "2026-09-08 (二)",
                items: [
                    "乙本L.2語詞部分",
                    "數習p.16~17",
                    
                ]
            },
            {
                date: "2026-09-09 (三)",
                items: [
                    "國L.2圈詞",

            },
            {

                ]
            },
            {

                items: [
                    "國習L.2",

                    "數練卷一張",

                ]
            },
            {
                date: "2026-09-14 (一)",
                items: [
                    "甲本L.3生字部分",
                    "數習p.22~23",
                    
                ]
            },
            {
                date: "2026-09-15 (二)",
                items: [
                    "甲本L.3語詞部分",
                    "數習p.24~25",
                    
                ]
            },
            {

                    "分享一件開心的事：___________",
                ]
            },
            {
                date: "2026-09-17 (四)",
                items: [
                    "國L.3成語造句",
                    "數習p.28~29",
                ]
            },
            {
                date: "2026-09-18 (五)",
                items: [
                    "國習L.3",
                    "數習p.30~31",
                    "做一件家事：___________",
                ]
            },
        ];

        // ==========================================
        // ⚙️ 以下為程式邏輯，如無特殊需求不需修改
        // ==========================================

        // 渲染每週一句與注意事項（這些是固定的，與日期無關）
        document.getElementById('quoteDisplay').textContent = weeklyQuote;
        
        const noticeHTML = notices.map(notice => `<li>${notice}</li>`).join('');
        document.getElementById('noticeDisplay').innerHTML = noticeHTML;

        
           // 初始化日期下拉選單並自動選取最適日期
const dateSelect = document.getElementById('dateSelect');

// 1. 計算今天與「當週五」的日期字串 (YYYY-MM-DD)
const now = new Date();

// 取得今天 YYYY-MM-DD
const formatDate = (dateObj) => {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
    const d = String(dateObj.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
};

const todayStr = formatDate(now);

// 計算當週五的日期
const dayOfWeek = now.getDay(); // 0 是週日, 1-5 是週一至週五, 6 是週六
const FridayDate = new Date(now);

if (dayOfWeek === 6) { 
    // 今天是週六 (如 9/5) -> 減 1 天得到週五 (9/4)
    FridayDate.setDate(now.getDate() - 1);
} else if (dayOfWeek === 0) { 
    // 今天是週日 (如 9/6) -> 減 2 天得到週五 (9/4)
    FridayDate.setDate(now.getDate() - 2);
}
const FridayStr = formatDate(FridayDate);

// 2. 比對與選擇適合的歷史紀錄索引
let defaultIndex = 0;
let isMatched = false;

contactBookRecords.forEach((record, index) => {
    const option = document.createElement('option');
    option.value = index; 
    option.textContent = record.date;
    dateSelect.appendChild(option);

    const recordDateStr = record.date.split(' ')[0]; // 擷取 "YYYY-MM-DD"

    // 判斷優先順序：
    // ① 若週末(六/日)，優先精確匹配「當週五」的日期
    if ((dayOfWeek === 0 || dayOfWeek === 6) && recordDateStr === FridayStr) {
        defaultIndex = index;
        isMatched = true;
    }
    // ② 若平日(一~五)，精確匹配「今天」
    else if (!isMatched && recordDateStr === todayStr) {
        defaultIndex = index;
        isMatched = true;
    }
    // ③ 備用：若尚未找到，且紀錄日期比今天新（如暑假開學前），暫存最接近的未來日期
    else if (!isMatched && recordDateStr >= todayStr) {
        defaultIndex = index;
    }
});

// 3. 設定下拉選單預設值
dateSelect.value = defaultIndex;

// 根據選單切換顯示對應的聯絡簿內容
function renderContent() {
    const selectedIndex = dateSelect.value;
    const selectedRecord = contactBookRecords[selectedIndex];

    if (!selectedRecord) return;

    // 更新標題日期
    document.getElementById('currentDateTitle').textContent = `📖 聯絡簿內容  ${selectedRecord.date}`;

    // 更新抄寫清單
    const homeworkHTML = selectedRecord.items.map(item => `<li>${item}</li>`).join('');
    document.getElementById('homeworkDisplay').innerHTML = homeworkHTML;
}

// 網頁載入時自動顯示
renderContent();
    </script>
</body>
</html>
